# ============================================================
#  CONEXION A MySQL — base creada con db/gestor_inventario_alba.sql
#  (Este archivo reemplaza a la vieja clase DatabaseConnection de JDBC:
#   ahora la conexion se configura, no se programa.)
#
#  La contrasena NO se escribe aca: se lee de la variable de entorno
#  DB_PASSWORD. Asi cada integrante usa la suya y ninguna queda
#  guardada en el repositorio.
#
#    export DB_PASSWORD=tu_password        (Mac / Linux)
#    setx DB_PASSWORD tu_password          (Windows)
#
#  Si no esta definida, se usa "root" como valor por defecto.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_inventario
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
#  HIBERNATE / JPA (el ORM: el puente objetos Java <-> tablas)
# ------------------------------------------------------------
# 'none' = Hibernate NO toca el esquema: usa las tablas tal cual las
# creo nuestro script SQL. (Si se pusiera 'update', Spring seria capaz
# de crear y modificar nuestras tablas solo, a partir de las @Entity.)
spring.jpa.hibernate.ddl-auto=none

# Dialecto de MySQL 8. Sin conexion viva Hibernate no puede deducirlo,
# asi que dejarlo explicito da errores mucho mas claros.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar en consola el SQL que genera Hibernate (excelente para aprender
# y para la defensa del TP: se ve el JPQL traducido a SQL real).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
#  SERVIDOR WEB
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
#  CORREO SALIENTE (comprobante de compra al cliente)
#
#  Igual que la base, nada de esto se escribe aca: sale de
#  variables de entorno.
#
#  La bodega manda por Brevo (proveedor de correo transaccional):
#
#    export MAIL_HOST=smtp-relay.brevo.com
#    export MAIL_PORT=587
#    export MAIL_USER=c1542c001@smtp-brevo.com
#    export MAIL_PASSWORD=xsmtpsib-...
#    export MAIL_AUTH=true
#    export MAIL_TLS=true
#
#  MAIL_AUTH y MAIL_TLS quedan en false por defecto porque el
#  servidor de prueba local no los usa; Brevo exige los dos.
#
#  DIFERENCIA A PROPOSITO CON DB_PASSWORD: aquella tiene un valor
#  por defecto ("root"); MAIL_PASSWORD no tiene ninguno. Si falta,
#  la app avisa al arrancar en vez de intentar mandar correos sin
#  credencial y fallar de forma rara en cada compra.
#
#  Para desarrollar sin cuenta de nadie alcanza con un servidor SMTP
#  de prueba en la propia maquina:
#    export MAIL_HOST=localhost MAIL_PORT=1025 MAIL_USER= MAIL_PASSWORD=
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
# Si el servidor no contesta, que corte y no deje la compra esperando.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# De quien salen los correos y a donde contesta el cliente si responde.
#  OJO: el remitente tiene que ser una direccion VERIFICADA en Brevo.
#  Si se pone cualquier otra, Brevo rechaza el envio entero.
#  albaenlosandes.com todavia no es un dominio nuestro, asi que no
#  se puede firmar (SPF/DKIM) y el mail terminaria en spam.
alba.correo.remitente=${MAIL_FROM:theolambert.ar@gmail.com}
alba.correo.responder-a=${MAIL_REPLY_TO:theolambert.ar@gmail.com}
# El nombre que ve el cliente en la bandeja de entrada. Sin esto, el
# correo muestra la parte de antes del arroba de la direccion (algo como
# "theolambert.ar"), que no le dice nada a quien compro. La direccion
# sigue siendo la misma, la verificada en Brevo: lo unico que cambia es
# el nombre que se muestra al lado.
alba.correo.nombre=${MAIL_FROM_NOMBRE:Alba en los Andes}
# A donde manda el cliente el comprobante de la transferencia.
#  Va APARTE del remitente y del responder-a a proposito: esos dos
#  tienen que ser la direccion verificada en Brevo (si no, el envio se
#  rechaza), mientras que esta es solo un texto que se imprime en el
#  correo y en la pantalla de pago. Por eso aca si puede ir la casilla
#  institucional de la bodega, aunque todavia no este dada de alta en
#  Brevo ni se lea desde el sistema.
alba.correo.pagos=${MAIL_PAGOS:albaenlosandes@gmail.com}
# Interruptor para apagar el envio sin desarmar nada (demos, pruebas).
alba.correo.activo=${MAIL_ACTIVO:true}

# Casilla de la bodega que recibe UNA COPIA de cada comprobante, para
# tener todas las ventas juntas en un buzon sin entrar al panel.
#
# Va como copia OCULTA: el cliente no la ve, y asi un "responder a todos"
# no le manda su respuesta a los dos lados.
#
# Vacio = no se manda copia a nadie.
alba.correo.copia=${MAIL_COPIA:}

# ------------------------------------------------------------
#  SALIDA POR LA API HTTP DE BREVO (puerto 443)
#
#  PARA QUE: muchas redes bloquean los puertos de SMTP para que una
#  maquina infectada no pueda mandar spam. El bloqueo es silencioso:
#  la conexion queda abierta y nunca contesta, asi que el error es
#  "Read timed out" con la configuracion perfecta. Comprobado en esta
#  maquina el 2026-11-04: los cuatro puertos de Brevo (25, 465, 587 y
#  2525) sin respuesta, y el 443 al instante.
#
#  Vacio = se usa SMTP, como siempre. Con valor = se usa la API y el
#  SMTP ni se toca. No hay que elegir a mano: alcanza con definir o no
#  definir la variable.
#
#  OJO, SON DOS CLAVES DISTINTAS: MAIL_PASSWORD es la de SMTP y aca no
#  sirve. Esta sale de Brevo -> Settings -> SMTP & API -> pestania
#  "API keys" -> Generate a new API key, y empieza con "xkeysib-".
#
#    export BREVO_API_KEY='xkeysib-...'
# ------------------------------------------------------------
alba.correo.api-key=${BREVO_API_KEY:}

# ------------------------------------------------------------
#  DATOS DE LA CUENTA PARA TRANSFERENCIAS
#
#  El mail de un pedido por transferencia tiene que repetir estos
#  datos: nadie transfiere en el mismo segundo en que compra.
#
#  ESTAN ESCRITOS UNA SOLA VEZ, aca. Los lee DatosBancarios y de ahi
#  salen las dos cosas que los muestran: la pantalla de pago y el mail
#  del comprobante. Antes estaban tambien en el JavaScript del
#  navegador, que es como se terminan separando dos copias de lo mismo.
# ------------------------------------------------------------
alba.banco.alias=tour.saxo.suma.mp
alba.banco.cvu=0000003100019063106767
alba.banco.titular=ALBA EN LOS ANDES SA

# ------------------------------------------------------------
#  INGRESO CON GOOGLE
#
#  El Client ID es PUBLICO por diseno: viaja en el HTML del navegador,
#  cualquiera que abra el sitio lo ve. Por eso puede estar escrito aca
#  y en el repositorio, al reves que la clave de la base.
#
#  El Client SECRET no aparece en ningun lado, y no hace falta: el
#  flujo de "Sign in with Google" por ID token no lo usa.
#
#  ESTE ES EL UNICO LUGAR DONDE SE ESCRIBE. De aca lo lee
#  ServicioGoogle para validar el token, y de aca lo saca tambien la
#  pantalla de ingreso (via ModeloGlobal) para dibujar el boton. Antes
#  estaba escrito a mano en el JavaScript ademas de aca, y si las dos
#  copias no coincidian se rechazaban todos los ingresos.
#
#  En Google Cloud hace falta tener cargado, en el mismo client id:
#    Authorized JavaScript origins -> http://localhost:8080
# ------------------------------------------------------------
alba.google.client-id=${GOOGLE_CLIENT_ID:417202778791-af38hruvgs1tust27jj050lkll4cm6sm.apps.googleusercontent.com}


# ============================================================
#  THYMELEAF - motor de plantillas del sitio web
# ============================================================
#  El sitio dejo de servirse aparte: lo sirve este mismo Spring Boot
#  en el puerto 8080, renderizando las plantillas de templates/.
#
#  LA CACHE VA APAGADA EN DESARROLLO. Con cache=true Thymeleaf compila
#  cada plantilla la primera vez y despues la lee de memoria, que es lo
#  correcto en produccion. Apagada, vuelve a leer el archivo en cada
#  pedido: se edita el HTML, se recarga el navegador y se ve el cambio
#  sin reiniciar Spring. Antes de entregar o publicar conviene sacar
#  esta linea (el valor por defecto ya es true).
spring.thymeleaf.cache=false

# ------------------------------------------------------------
#  DONDE VIVE EL FRONT
# ------------------------------------------------------------
#  EL FRONTEND NO ESTA ADENTRO DEL BACKEND: vive en la carpeta
#  frontend/ de la raiz del repositorio, al lado de backend/, porque
#  son dos cosas distintas y conviene verlas como dos cosas distintas.
#
#      ../../frontend/templates/   las paginas que arma el servidor
#                                  (no se piden por URL)
#      ../../frontend/static/      lo que el navegador baja tal cual:
#                                  css, imagenes, htmx y los pocos
#                                  JavaScript que quedan
#
#  PERO SPRING LAS BUSCA EN EL CLASSPATH, no en el disco. Quien las
#  pone ahi es Maven: el bloque <resources> de pom.xml copia
#  ../frontend adentro del jar, bajo la carpeta 'frontend'. Por eso
#  estas dos lineas dicen classpath:/frontend/... y no una ruta del
#  disco: para que el jar funcione igual en cualquier maquina.
#
#  Consecuencia practica: un cambio en una plantilla o en el CSS se ve
#  despues de volver a arrancar, igual que un cambio en Java.
#
#  (Spring Boot por defecto busca en classpath:/templates/ y
#  classpath:/static/. Estas dos lineas lo corren una carpeta mas
#  adentro, que es donde las deja Maven.)
spring.thymeleaf.prefix=classpath:/frontend/templates/
spring.web.resources.static-locations=classpath:/frontend/static/

#  Estos dos son los valores por defecto de Spring Boot. Se escriben
#  igual para que esten a la vista de quien lea este archivo.
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------
#  GOOGLE: el origen cambio al mudar el sitio adentro de Spring
# ------------------------------------------------------------
#  El boton de Google verifica desde que direccion se lo invoca. Mientras
#  el frontend se servia con python en el 8099, el origen autorizado en
#  Google Cloud tenia que ser http://localhost:8099. Ahora el sitio lo
#  sirve Spring, asi que hay que cargar http://localhost:8080 en
#  "Origenes autorizados de JavaScript" del mismo client id, o el ingreso
#  con Google falla con "Error 400: origin_mismatch".
