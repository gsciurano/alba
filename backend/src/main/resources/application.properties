# ============================================================
#  CONEXION A MySQL — base creada con db/gestor_inventario_alba.sql
#  (Este archivo reemplaza a la vieja clase DatabaseConnection de JDBC:
#   ahora la conexion se configura, no se programa.)
#
#  La contrasena NO se escribe aca: se lee de la variable de entorno
#  DB_PASSWORD. Asi cada integrante usa la suya y ninguna queda
#  guardada en el repositorio.
#
#    export DB_PASSWORD=tu_password        (Mac / Linux)
#    setx DB_PASSWORD tu_password          (Windows)
#
#  Si no esta definida, se usa "root" como valor por defecto.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_inventario
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
#  HIBERNATE / JPA (el ORM: el puente objetos Java <-> tablas)
# ------------------------------------------------------------
# 'none' = Hibernate NO toca el esquema: usa las tablas tal cual las
# creo nuestro script SQL. (Si se pusiera 'update', Spring seria capaz
# de crear y modificar nuestras tablas solo, a partir de las @Entity.)
spring.jpa.hibernate.ddl-auto=none

# Dialecto de MySQL 8. Sin conexion viva Hibernate no puede deducirlo,
# asi que dejarlo explicito da errores mucho mas claros.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar en consola el SQL que genera Hibernate (excelente para aprender
# y para la defensa del TP: se ve el JPQL traducido a SQL real).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
#  SERVIDOR WEB
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
#  CORREO SALIENTE (comprobante de compra al cliente)
#
#  Igual que la base, nada de esto se escribe aca: sale de
#  variables de entorno.
#
#  La bodega manda por Brevo (proveedor de correo transaccional):
#
#    export MAIL_HOST=smtp-relay.brevo.com
#    export MAIL_PORT=587
#    export MAIL_USER=c1542c001@smtp-brevo.com
#    export MAIL_PASSWORD=xsmtpsib-...
#    export MAIL_AUTH=true
#    export MAIL_TLS=true
#
#  MAIL_AUTH y MAIL_TLS quedan en false por defecto porque el
#  servidor de prueba local no los usa; Brevo exige los dos.
#
#  DIFERENCIA A PROPOSITO CON DB_PASSWORD: aquella tiene un valor
#  por defecto ("root"); MAIL_PASSWORD no tiene ninguno. Si falta,
#  la app avisa al arrancar en vez de intentar mandar correos sin
#  credencial y fallar de forma rara en cada compra.
#
#  Para desarrollar sin cuenta de nadie alcanza con un servidor SMTP
#  de prueba en la propia maquina:
#    export MAIL_HOST=localhost MAIL_PORT=1025 MAIL_USER= MAIL_PASSWORD=
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
# Si el servidor no contesta, que corte y no deje la compra esperando.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# De quien salen los correos y a donde contesta el cliente si responde.
#  OJO: el remitente tiene que ser una direccion VERIFICADA en Brevo.
#  Si se pone cualquier otra, Brevo rechaza el envio entero.
#  albaenlosandes.com todavia no es un dominio nuestro, asi que no
#  se puede firmar (SPF/DKIM) y el mail terminaria en spam.
alba.correo.remitente=${MAIL_FROM:theolambert.ar@gmail.com}
alba.correo.responder-a=${MAIL_REPLY_TO:theolambert.ar@gmail.com}
# El nombre que ve el cliente en la bandeja de entrada. Sin esto, el
# correo muestra la parte de antes del arroba de la direccion (algo como
# "theolambert.ar"), que no le dice nada a quien compro. La direccion
# sigue siendo la misma, la verificada en Brevo: lo unico que cambia es
# el nombre que se muestra al lado.
alba.correo.nombre=${MAIL_FROM_NOMBRE:Alba en los Andes}
# Interruptor para apagar el envio sin desarmar nada (demos, pruebas).
alba.correo.activo=${MAIL_ACTIVO:true}

# Casilla de la bodega que recibe UNA COPIA de cada comprobante, para
# tener todas las ventas juntas en un buzon sin entrar al panel.
#
# Va como copia OCULTA: el cliente no la ve, y asi un "responder a todos"
# no le manda su respuesta a los dos lados.
#
# Vacio = no se manda copia a nadie.
alba.correo.copia=${MAIL_COPIA:}

# ------------------------------------------------------------
#  DATOS DE LA CUENTA PARA TRANSFERENCIAS
#
#  El mail de un pedido por transferencia tiene que repetir estos
#  datos: nadie transfiere en el mismo segundo en que compra.
#
#  SI, ESTAN TAMBIEN EN frontend/js/modules/transferencia.js. El
#  checkout los muestra sin pedirselos al servidor, y el mail lo arma
#  el servidor sin pasar por el navegador: son dos lugares distintos
#  y ninguno puede leer al otro. Si cambian, hay que tocar LOS DOS.
# ------------------------------------------------------------
alba.banco.alias=tour.saxo.suma.mp
alba.banco.cvu=0000003100019063106767
alba.banco.titular=ALBA EN LOS ANDES SA

# ------------------------------------------------------------
#  INGRESO CON GOOGLE
#
#  El Client ID es PUBLICO por diseno: viaja en el HTML del navegador,
#  cualquiera que abra el sitio lo ve. Por eso puede estar escrito aca
#  y en el repositorio, al reves que la clave de la base.
#
#  El Client SECRET no aparece en ningun lado, y no hace falta: el
#  flujo de "Sign in with Google" por ID token no lo usa.
#
#  OJO: tiene que ser EL MISMO que el del frontend (cuenta.html). El
#  back-end comprueba que el token venga emitido para este client id,
#  asi que si no coinciden, todos los ingresos se rechazan.
#
#  En Google Cloud hace falta tener cargado, en el mismo client id:
#    Authorized JavaScript origins -> http://localhost:8099
# ------------------------------------------------------------
alba.google.client-id=${GOOGLE_CLIENT_ID:417202778791-af38hruvgs1tust27jj050lkll4cm6sm.apps.googleusercontent.com}
