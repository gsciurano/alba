<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — Alba en los Andes</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/sitio.css">
</head>
<body data-pagina="cuenta">
  <main id="contenido">
    <!--
      Esta pagina tiene dos caras y las dos las arma js/cuenta.js:
        - visitante: ingresar o crear cuenta
        - cliente:   sus pedidos y el circuito de cancelacion
      Un ADMIN que entra se va derecho al panel de gestion.
    -->
    <div id="vistaCuenta"></div>
  </main>

  <div id="raizModal"></div>
  <!--
    Google Identity Services: es lo que dibuja el boton oficial con el
    logo. Viene de accounts.google.com y no de npm, asi que no rompe la
    regla del proyecto, pero SI necesita internet: sin conexion el boton
    no aparece (el formulario de email y contrasena sigue andando).
    'defer' para que no frene el dibujado de la pagina.
  -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script type="module" src="js/cuenta.js"></script>
</body>
</html>
